# Temporarily pinned to the 2021 style edition for the Edition 2024 language
# migration commit, so that commit contains only the hand-written semantic
# changes and stays reviewable.
#
# Without this pin, flipping `edition` to 2024 also switches rustfmt's default
# `style_edition` to 2024, which version-sorts `use` items and re-wraps long
# single-argument macro calls across ~340 lines of otherwise untouched code.
# Mixing that into the migration would bury the ~25 lines that actually change
# meaning.
#
# REMOVED IN THE VERY NEXT COMMIT, which applies the 2024 reformat on its own.
# If you are reading this in a released tree, something went wrong.
style_edition = "2021"
