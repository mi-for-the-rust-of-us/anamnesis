name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "MSRV (1.88)"
            toolchain: "1.88"
          - name: "Stable"
            toolchain: "stable"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

  # ThreadSanitizer over the parallelised dequant paths.
  #
  # CONVENTIONS.md "When Parallelizing Work" -> "Verify parallelism" item 3 asks
  # for a race-detector run "where the platform supports it". The maintainer's
  # platform is Windows/MSVC, which has no TSan, so this is the only place the
  # rule can actually be satisfied — Phase 7 (v0.7.0) shipped the first threaded
  # code without it, and Phase 7.2 closes that gap for both the safetensors and
  # the GGUF path at once.
  #
  # The disjoint-output design is race-free by construction (each worker writes
  # only the buffer it returns; the sole shared mutable datum is the scheduling
  # AtomicUsize), so this is a backstop against a future edit breaking that — not
  # a suspicion about the current code.
  #
  # NO -Zbuild-std, deliberately. The ideal setup instruments the standard
  # library too, so TSan can see std's own synchronisation. That is not
  # achievable here: `-Zbuild-std` combined with `cargo test` is a documented,
  # unresolved Cargo limitation (rust-lang/cargo#13146), which reports exactly
  # our failure -- `cargo test --target x86_64-unknown-linux-gnu` producing
  # "duplicate lang item in crate `core`" -- and states the conflict is general
  # to build-std, not specific to no_main. The workarounds offered there are to
  # split the crate into subcrates or drive the build from a Makefile; neither
  # is worth it for a backstop job.
  #
  # Four configurations were tried before reading that issue (blanket RUSTFLAGS,
  # target-scoped RUSTFLAGS, -Ztarget-applies-to-host, and both panic runtimes
  # in the build-std set). All four failed identically, with byte-identical
  # `core` fingerprints every time -- the tell that no command-line flag was
  # touching the real cause. Do not retry those; read the issue first.
  #
  # What we lose: TSan cannot see synchronisation performed inside uninstrumented
  # std, so it may in principle report a false positive. In practice the risk is
  # low for this crate -- the dispatch synchronises with a plain
  # AtomicUsize::fetch_add and thread::scope's join, and TSan intercepts the
  # pthread primitives underneath join regardless of instrumentation. The
  # documented false-positive sources (std::sync::atomic::fence, inline asm) are
  # not used anywhere in the parallel path.
  #
  # Requirements and quirks, all load-bearing:
  #   * nightly, because -Zsanitizer is unstable. rust-src is no longer needed
  #     without build-std, but is harmless and kept for a future retry.
  #   * an explicit --target is still REQUIRED even without build-std: it is what
  #     keeps build scripts and proc macros (clap_derive, serde_derive, codspeed)
  #     out of the instrumented graph.
  #   * CARGO_TARGET_<TRIPLE>_RUSTFLAGS, *not* a blanket RUSTFLAGS, for the same
  #     reason -- a blanket RUSTFLAGS also reaches host artefacts.
  #   * RUST_TEST_THREADS=1: libtest's own harness races under TSan
  #     (rust-lang/rust#39608). Running tests sequentially is the documented
  #     workaround and costs nothing here -- the code under test spawns its own
  #     threads regardless, which is the whole point.
  #   * --release: an instrumented debug build of the dequant kernels is slow
  #     enough to hit the job timeout.
  #   * continue-on-error is NOT set — a detected race must fail CI.
  tsan:
    name: ThreadSanitizer (parallel paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan

      # The whole unit-test suite rather than a name filter. Every thread the
      # crate spawns is spawned from `src/`, so `--lib` covers the entire
      # concurrent surface (the dispatch helper's own tests, the GGUF reader
      # determinism sweep across budgets, and the safetensors remember sweep) —
      # and running it unfiltered means a future parallelised path is covered the
      # day it lands, with no filter to remember to update. The suite is fast
      # enough that the ~10-20x instrumentation slowdown is affordable.
      - name: Test under ThreadSanitizer
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zsanitizer=thread"
          # `halt_on_error` makes the first detected race fail loudly instead of
          # being buried in later output.
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
          RUST_TEST_THREADS: "1"
        run: |
          cargo +nightly test --release --all-features \
            --target x86_64-unknown-linux-gnu \
            --lib

      - name: Test the parallel auto-trait contract under ThreadSanitizer
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zsanitizer=thread"
          TSAN_OPTIONS: "halt_on_error=1"
          RUST_TEST_THREADS: "1"
        run: |
          cargo +nightly test --release --all-features \
            --target x86_64-unknown-linux-gnu \
            --test parallel_contract
