name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only workflow token: nothing in this workflow writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "MSRV (1.88)"
            toolchain: "1.88"
          - name: "Stable"
            toolchain: "stable"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The axis v0.7.3 shipped red on: a `pub(crate)` item consumed only from a
      # feature-gated module is live under `--all-features` and dead without it,
      # and rustc 1.88's dead-code analysis also differs from stable's. It was
      # only in the manual release gauntlet (CLAUDE.md); running it here on both
      # toolchains catches it on the push that introduces it.
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features

      # 64-bit layout asserts once made `--features gguf` fail to compile on
      # 32-bit targets, which a Python wheel matrix (win32, armv7) can include.
      # A check needs only the target's std, no cross linker.
      - name: Check (32-bit, all features)
        run: |
          rustup target add i686-unknown-linux-gnu
          cargo check --locked --target i686-unknown-linux-gnu --all-features

  # Rustdoc was checked only by `publish.yml`, at release time, with
  # `--all-features` and public items only. That misses two whole classes of
  # breakage, both of which this repository has actually shipped:
  #
  #   * An intra-doc link that resolves under `--all-features` but not under an
  #     intermediate combination, because the item it names is feature-gated.
  #     `--all-features` cannot see these by construction.
  #   * A broken link on a `pub(crate)` item, which no public-items run reaches.
  #     Phase 7.6 found three of these left behind by its own refactor, plus
  #     five pre-existing ones.
  #
  # Catching either at `cargo publish` time is too late: the tag is already cut.
  docs:
    name: "Docs (feature combos, private items)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rustdoc across feature combinations
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          # Default features first, then each axis. `$combo` is intentionally
          # unquoted: the multi-word entries must word-split into flags.
          echo "::group::cargo doc (default features)"
          cargo doc --locked --no-deps --document-private-items
          echo "::endgroup::"
          for combo in \
            "--all-features" \
            "--no-default-features" \
            "--no-default-features --features npz" \
            "--no-default-features --features pth" \
            "--no-default-features --features gguf" \
            "--no-default-features --features bnb" \
            "--no-default-features --features gptq" \
            "--no-default-features --features awq" \
            "--no-default-features --features cli" \
            "--no-default-features --features ollama" \
            "--features cli,gguf,npz,pth"
          do
            echo "::group::cargo doc $combo"
            cargo doc --locked --no-deps --document-private-items $combo
            echo "::endgroup::"
          done

  # Dependency supply chain, per `deny.toml`: RustSec advisories (a yanked or
  # compromised release of a dependency shows up here), licences, and sources
  # (crates.io only, no git dependencies). Build scripts and proc-macros run
  # arbitrary code at build time, which makes this the Rust counterpart of the
  # `site-packages/*.pth` start-up hook the LiteLLM 1.82.8 payload used.
  deny:
    name: "Dependencies (cargo-deny)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
