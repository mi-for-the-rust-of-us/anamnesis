name: Upstream ggml types

# Compares `tests/fixtures/ggml_types.txt` with the live `GGML_TYPE_*` entries
# of llama.cpp's `ggml.h` on `master`, and fails, naming the difference, when
# upstream has added or removed a type.
#
# Why it exists: anamnesis tracks `enum ggml_type` by hand. Upstream added
# `NVFP4` (40), `Q1_0` (41) and `Q2_0` (42), and nothing noticed until a user's
# NVFP4 file was refused outright (issue #15, fixed in Phase 7.10). The offline
# half of the check is `tests/gguf_type_snapshot.rs`, which holds the parser to
# the snapshot; this job holds the snapshot to upstream.
#
# Scheduled weekly, and otherwise run only when the check itself changes:
# upstream moves on its own clock, and a type added there must not turn an
# unrelated PR red. A failure on the schedule is a to-do (teach the parser the
# new type, with its block layout and a kernel, then refresh the snapshot), not
# a regression in this repository.
#
# The `paths:` triggers exist because GitHub runs `schedule` and
# `workflow_dispatch` only from the default branch, so a workflow that has
# never been merged has never run anywhere. With them, the push or pull
# request that adds or edits this file, the extraction script or the snapshot
# runs the job on the spot, and a broken check is caught by the change that
# broke it rather than by a silent Monday.
on:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ggml-drift.yml"
      - "scripts/ggml-types.sh"
      - "tests/fixtures/ggml_types.txt"
  pull_request:
    paths:
      - ".github/workflows/ggml-drift.yml"
      - "scripts/ggml-types.sh"
      - "tests/fixtures/ggml_types.txt"

permissions:
  contents: read

jobs:
  ggml-types:
    name: "Upstream ggml types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the snapshot with ggml.h on master
        run: |
          set -euo pipefail
          # Resolve master to a commit first, so the report names exactly what
          # was compared and the snapshot can be refreshed from it.
          commit="$(git ls-remote https://github.com/ggml-org/llama.cpp refs/heads/master | cut -f1)"
          if [ -z "${commit}" ]; then
            echo "::error title=ggml_type drift::Could not resolve llama.cpp master; nothing was compared."
            exit 1
          fi
          echo "llama.cpp master is ${commit}"
          # An empty extraction would read as "every type was removed"; say
          # what it really means instead.
          if ! curl -fsSL "https://raw.githubusercontent.com/ggml-org/llama.cpp/${commit}/ggml/include/ggml.h" \
            | scripts/ggml-types.sh > upstream.txt || [ ! -s upstream.txt ]; then
            echo "::error title=ggml_type drift::Extracted no GGML_TYPE_* entries from ggml.h at llama.cpp ${commit}. The header moved or its format changed: the check needs updating, not the parser."
            exit 1
          fi
          grep -v '^#' tests/fixtures/ggml_types.txt > snapshot.txt
          if diff -u snapshot.txt upstream.txt; then
            echo "The parser's type table matches llama.cpp ${commit}."
          else
            echo "::error title=ggml_type drift::llama.cpp ${commit} has a different set of GGML_TYPE_* entries from tests/fixtures/ggml_types.txt (diff above: '+' lines are new upstream). Teach the GGUF parser the new type(s), then regenerate the snapshot from that commit."
            exit 1
          fi
