# Continuous ARM drift detection via CodSpeed (https://codspeed.io).
#
# ============================================================================
# THIS JOB WATCHES FOR DRIFT. IT DOES NOT DECIDE WHETHER A CHANGE IS FASTER.
# ============================================================================
#
# ARCHITECTURE — the single most important fact about this file. CodSpeed's
# walltime instrument runs *only* on `codspeed-macro` runners, and those are
# **Linux aarch64, server-class bare metal** (Ampere/Graviton class). There is
# no x86-64 option: walltime requires CodSpeed's own hosted macro runners, and
# self-hosted runners are not supported. So this job cannot measure the
# architecture this crate is developed and released on.
#
# It is worth keeping anyway, because `aarch64` is a first-class target for a
# GGUF crate: Apple Silicon is one of the most common local-LLM platforms there
# is, and Graviton/Ampere carry a real share of cloud inference. But note what
# this is NOT:
#
#   * NOT Apple Silicon. M-series has a different microarchitecture (wider
#     decode, far larger caches, different memory bandwidth) and ARMv8.2+
#     hardware FP16 arithmetic, under macOS rather than Linux. This is the
#     closest continuous proxy available, and it is only a proxy. Phase 7.7's
#     finding that `F16Out::write_scratch` fails to inline here has NOT been
#     confirmed on an M-series chip.
#   * NOT the whole story. Two numbers can disagree between architectures and
#     both be right; Phase 7.7 item 1 found exactly that for `AWQ` at `F16`.
#
# WHY `pull_request` IS GONE. It used to run on PRs, and that was actively
# harmful: it rendered a verdict on changes it measured on the wrong
# architecture, at ~4 % effective resolution, 18 minutes after the fact. Phase
# 7.7 item 1 was nearly decided on such a verdict. Deciding whether a change is
# faster is now done *locally on x86-64* with the paired harness in
# `benches/ab.rs`, which answers in seconds. Removing the trigger makes that
# structural rather than a matter of remembering.
#
# WHAT IT STILL BUYS. Nobody runs a local benchmark on every merge. This job
# runs on every push to `main` that touches code (see the `paths:` filter), and
# it holds the ARM time series that would otherwise not exist.
#
# Macro runners require a GitHub *organization* (not a personal account) and
# draw from the org's monthly macro-runner minutes. The local best-of-N protocol
# in CLAUDE.md remains the release-gating authority.
name: CodSpeed (aarch64 drift watch)

on:
  # QUOTA, AND WHY THE `paths:` FILTER EXISTS. The organisation's free plan is
  # 600 macro-runner minutes a month, about 33 runs of this ~18-minute suite.
  # Phase 7.7 spent 22 in three days, 16 of them on pushes to `main` that
  # changed only documentation, and CodSpeed disabled the runners for the rest
  # of August 2026. The trigger was commented out from 2026-08-23 until the
  # v0.7.8 close-out re-enabled it. A benchmark suite has no business running
  # on a commit that changes only comments; on Phase 7.7's own history this
  # filter would have cut the `main` runs by roughly half.
  #
  # If the allowance runs out again, comment `push:` out with a dated note
  # rather than leaving the job failing: a red check on every push trains
  # readers to click past it, which is the failure Phase 7.7 item 11 was about.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codspeed.yml'
  # A deliberate run, e.g. to record a baseline at a release tag.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: codspeed-macro
    permissions:
      contents: read
      id-token: write # OIDC auth to CodSpeed — no CODSPEED_TOKEN secret needed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust toolchain, cache, and cargo-codspeed
        uses: moonrepo/setup-rust@cafffba5d5c8bc38a5120e6e60f3561d541a47cd # v0.6.1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      # Every feature the four bench targets require, listed explicitly rather
      # than via `--all-features`, because ONE feature must stay off here:
      # `bench-fileio`. It compiles the two file-writing groups in
      # `benches/convert.rs`, which on macro runners measure CI storage rather
      # than this crate — they report 1.00× across thread budgets, and their
      # CodSpeed BASE disagrees with criterion's own median by ~2×. See the
      # `bench-fileio` entry in `Cargo.toml` for the numbers.
      #
      # Required-features by target: ab and dequant need gptq/awq/bnb/gguf, parsing
      # needs npz/pth/gguf, convert needs gguf. `parallel` is on by default.
      - name: Build the benchmark targets
        run: cargo codspeed build --features gptq,awq,bnb,gguf,npz,pth

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: walltime
          run: cargo codspeed run
