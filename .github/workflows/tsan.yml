name: ThreadSanitizer

# Race detection over the parallel dequant dispatch, with an INSTRUMENTED
# standard library.
#
# This satisfies CONVENTIONS.md "When Parallelizing Work" -> "Verify
# parallelism" item 3, which asks for a race-detector run "where the platform
# supports it". The maintainer's platform is Windows/MSVC, which has no TSan, so
# CI is the only place the rule can be satisfied at all.
#
# The disjoint-output design is race-free by construction — each worker writes
# only the buffer it returns, and the sole shared mutable datum is the
# scheduling AtomicUsize — so this job is a backstop against a future edit
# breaking that invariant, not a suspicion about the current code.
#
# ---------------------------------------------------------------------------
# THE RECIPE, AND WHY EVERY PART OF IT IS LOAD-BEARING
# ---------------------------------------------------------------------------
#
# Three constraints must hold *simultaneously*. Each one alone still fails, and
# each was learned from a distinct red build. If you change any of them, expect
# the job to break in a way whose error message points somewhere else entirely.
#
# 1. A `--bin` TARGET, NOT `cargo test`.
#    `-Zbuild-std` is unusable with `cargo test` (rust-lang/cargo#13146, open
#    since 2023): `cargo test` also compiles dev-dependencies, and several of
#    those are crates `std` itself depends on — `cfg-if` reaches us through the
#    unconditional `flate2` dev-dep — which collide as
#    `error[E0152]: duplicate lang item in crate `core``.
#    `cargo run --bin` builds NO dev-dependencies, so that collision surface
#    simply is not there. This is why the harness is a binary
#    (`src/bin/tsan_harness.rs`) rather than a test.
#
# 2. `-Cunsafe-allow-abi-mismatch=sanitizer`.
#    `compiler_builtins` is not instrumentable, so rustc refuses the link with
#    "mixing `-Zsanitizer` will cause an ABI mismatch ... incompatible with
#    `-Zsanitizer` being unset in dependency `compiler_builtins`". The flag is
#    rustc's own suggested opt-out. `compiler_builtins` is memcpy/memset
#    intrinsics with no synchronisation of its own, so mixing it in is inert as
#    far as a race detector is concerned.
#
#    NOT a constraint, despite two earlier revisions of this file saying so:
#    the CHOICE OF FLAG SOURCE does not matter. Blanket `RUSTFLAGS` and
#    `CARGO_TARGET_<TRIPLE>_RUSTFLAGS` were both verified green with identical
#    flag content, in a single-variable test against this configuration. An
#    earlier draft claimed the target-scoped form "does not reach -Zbuild-std
#    units" and was heading for an upstream bug report; that conclusion came
#    from a comparison in which two variables changed at once (the source AND
#    the newly added ABI opt-out), and it did not survive isolating them. The
#    `core` fingerprint change that looked like evidence was the ABI flag
#    altering the fingerprint. Either form works; blanket is used below only
#    because it is what the first green run happened to use.
#
#    Passing `--target` is what keeps build scripts and proc macros
#    uninstrumented, per the Cargo book: "If the --target flag is used, then the
#    flags will only be passed to the compiler for the target. Things being
#    built for the host, such as build scripts or proc macros, will not receive
#    the args."
#
# 3. `panic_abort` IN THE BUILD-STD SET.
#    Cargo.toml sets `panic = "abort"` for [profile.release] and this job builds
#    --release. A build-std set without `panic_abort` leaves rustc unable to
#    find one in the self-built sysroot, so it falls back to the REAL sysroot's
#    `panic_abort` — which drags that sysroot's `core` in behind it, producing
#    E0152 again, this time with one core in target/ and one in ~/.rustup.
#    See rust-lang/cargo#15347 and rust-lang/rust#115963.
#

# ---------------------------------------------------------------------------
# WHY AN INSTRUMENTED std IS NOT OPTIONAL HERE
# ---------------------------------------------------------------------------
#
# The Rust Unstable Book is explicit that ThreadSanitizer "require[s] all code
# to be instrumented since otherwise [it] generate[s] false positives". For this
# crate that is not a quality-of-results matter but a correctness-of-the-tool
# one: with an uninstrumented std, `std::thread::scope`'s own Arc teardown
# false-positives (rust-lang/rust#101206, `free` racing `atomic_sub`) — and
# scoped threads ARE the mechanism under test. The detector would fire on
# precisely the thing it exists to check.
#
# A no-build-std configuration was tried and abandoned for exactly this reason.
# It also required suppressing libtest's own result channel
# (rust-lang/rust#39608); the next report after that landed in
# `std::sys::thread::unix::Thread::new`, which `thread::scope` also uses, so
# suppressing further would have blinded the job to our own thread creation.
# `.github/tsan-suppressions.txt` is retained only as the record of that dead
# end — it is NOT referenced by this workflow and should not be reintroduced
# without re-reading its header.
#
# ---------------------------------------------------------------------------
# REMAINING CHOICES
# ---------------------------------------------------------------------------
#
#   * nightly + rust-src: -Zsanitizer and -Zbuild-std are both unstable, and
#     build-std needs the standard library source.
#   * --release: an instrumented debug build of the dequant kernels is slow
#     enough to risk the job timeout.
#   * continue-on-error is NOT set — a detected race must fail CI.
#
# The harness itself (what is exercised, and why the fixture is sized the way it
# is) is documented in src/bin/tsan_harness.rs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tsan:
    name: ThreadSanitizer (parallel paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan

      - name: Parallel dispatch under ThreadSanitizer (instrumented std)
        env:
          # Either flag source works (verified); see constraint 2 in the header.
          RUSTFLAGS: "-Zsanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
          # `halt_on_error` makes the first detected race fail loudly rather
          # than being buried in later output.
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
        run: |
          cargo +nightly run --release \
            -Zbuild-std=std,panic_abort,panic_unwind \
            --target x86_64-unknown-linux-gnu \
            --bin tsan-harness
