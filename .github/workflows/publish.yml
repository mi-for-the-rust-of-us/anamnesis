name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# SUPPLY-CHAIN POSTURE. The LiteLLM compromise of 2026-03-24 did not exploit
# LiteLLM's code: a long-lived PyPI token, stolen from CI through an earlier
# compromised GitHub Action, was used to upload straight to the registry. This
# workflow is shaped so that no link of that chain exists here:
#
#   * No registry secret. `cargo publish` authenticates through crates.io
#     Trusted Publishing: GitHub's OIDC token is exchanged for a crates.io token
#     that lives ~30 minutes and only for this repository + workflow file +
#     `release` environment (as configured on crates.io). There is no
#     `CARGO_REGISTRY_TOKEN` left to steal, from CI or from a laptop.
#   * No third-party code runs while the job can mint that token. Building and
#     testing executes the build scripts and proc-macros of every dependency,
#     dev-dependencies included. That happens in `verify`, which holds no
#     `id-token` permission and a read-only workflow token. `publish` then runs
#     `cargo publish --no-verify`, which packages and uploads without compiling
#     anything. (Phase 7.9, audit finding M-5: the first version of this file ran
#     `cargo test` in the job that held `id-token: write`.)
#   * No mutable code. Every third-party action is pinned to a full commit SHA
#     (the tag it came from is in the trailing comment), no job restores a build
#     cache, and every cargo command uses `--locked`, so a release builds exactly
#     the committed `Cargo.lock`.
#   * A human in the loop. The `release` environment requires the maintainer's
#     approval before `publish` starts, so a pushed tag alone cannot publish.
#
# Only a `v*` tag may publish. `workflow_dispatch` stays available for re-running
# a release, but must be started from the tag, not a branch.
jobs:
  # Everything that compiles or runs code from dependencies.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable
          components: clippy, rustfmt

      # A tag whose CHANGELOG section is missing fails here, before anything is
      # published, rather than in `release` after crates.io already has it.
      - name: Check this version's CHANGELOG section
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features

      # `--document-private-items` as well as the public surface: a broken link
      # on a `pub(crate)` item is invisible to a public-items run, and CI's
      # `docs` job checks the same thing across feature combinations.
      - name: Doc check
        run: cargo doc --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      # The verification build `cargo publish` would otherwise run in the job
      # that holds `id-token: write`: package the crate and build it from the
      # packaged sources, exactly as crates.io users will.
      - name: Package and verify
        run: cargo package --locked

  # Holds `id-token: write`, and runs no third-party code.
  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    # `id-token: write` lets the job request the OIDC token that Trusted
    # Publishing exchanges for a short-lived crates.io token. `contents: read`
    # is what `actions/checkout` needs.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `--no-verify`: the verification build already ran in `verify`, from the
      # same commit. Running it here would compile dependency build scripts
      # while this job can mint a publish token.
      - name: Publish to crates.io
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Since v0.7.3 the published crate excludes `tests/` (Cargo.toml `exclude`),
  # which took the .crate from 4.8 MiB to under 1 MiB. The test corpus reaches
  # users through the GitHub Release created here: GitHub serves a source
  # tarball per tag containing `tests/` verbatim, so no artefact is built or
  # uploaded that could drift from the tag.
  #
  # Runs AFTER `publish` on purpose: a Release must never advertise a version
  # whose publish failed. It needs `contents: write`, which is why it is its own
  # job and runs no cargo. (Without that permission `gh release create` fails
  # with `HTTP 403: Resource not accessible by integration`, which is exactly
  # what happened on the v0.7.3 tag, after `cargo publish` had succeeded.)
  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
            cat <<'FOOTER'

          ---

          ### Verifying the correctness claims

          The published crate on crates.io excludes `tests/` (under 1 MiB instead of
          4.8 MiB). The cross-validation corpus ships here instead: the **Source
          code (tar.gz)** asset below contains `tests/` verbatim.

          ```bash
          tar xzf anamnesis-<tag>.tar.gz && cd anamnesis-*
          ./scripts/verify-claims.sh          # or scripts\verify-claims.ps1
          ```

          That runs the `cross_validation_*` suites against goldens produced by
          each format's own canonical library. Note what it does and does not
          prove: it checks anamnesis against goldens committed to this repo, and
          does **not** re-derive those goldens from PyTorch / `gguf-py`. See the
          script output for how to do that stronger check.
          FOOTER
          } > release-body.md
          gh release create "$GITHUB_REF_NAME"             --title "$GITHUB_REF_NAME"             --notes-file release-body.md             --verify-tag
