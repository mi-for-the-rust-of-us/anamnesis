[package]
name = "anamnesis-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Path-based targets materialise the fuzz input to a temp file so the
# data-extraction parsers (`parse_npz`, `parse_pth`) can be reached.
tempfile = "3"

[dependencies.anamnesis]
path = ".."
features = ["npz", "pth", "gguf"]

# Own workspace so it is not absorbed into the parent; the published
# `anamnesis` crate excludes `/fuzz` entirely (see the root `Cargo.toml`).
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_safetensors"
path = "fuzz_targets/fuzz_safetensors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_npz"
path = "fuzz_targets/fuzz_npz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gguf"
path = "fuzz_targets/fuzz_gguf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gguf_front_matter"
path = "fuzz_targets/fuzz_gguf_front_matter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pth"
path = "fuzz_targets/fuzz_pth.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pth_front_matter"
path = "fuzz_targets/fuzz_pth_front_matter.rs"
test = false
doc = false
bench = false

# Phase 6.12: the vendored ZIP central-directory reader, exercised over every
# public entry point that routes through it (mmap + reader substrates).
[[bin]]
name = "fuzz_zip"
path = "fuzz_targets/fuzz_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_npz_parse"
path = "fuzz_targets/fuzz_npz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pth_parse"
path = "fuzz_targets/fuzz_pth_parse.rs"
test = false
doc = false
bench = false

# Limit-enforcement targets (Phase 6.8 Step 5): parse under a `ParseLimits`
# derived from the input, exercising the `check_alloc` / `Budget::charge_alloc`
# / `check_item_count` / `check_decompression_ratio` branches.
[[bin]]
name = "fuzz_npz_limits"
path = "fuzz_targets/fuzz_npz_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gguf_limits"
path = "fuzz_targets/fuzz_gguf_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pth_limits"
path = "fuzz_targets/fuzz_pth_limits.rs"
test = false
doc = false
bench = false

# Phase 6.13 Step 1: the copy-based (`no-mmap`) full-parse entry points
# (`parse_bytes` / `parse_gguf_bytes` / `parse_pth_bytes`) — the recommended
# untrusted-input path, owned `Vec<u8>` instead of a mmap. They reach the full
# data parse (deeper than the inspect-only targets); the panic-freedom invariant
# (Phase 6.13 Step 3) must hold on this path too.
[[bin]]
name = "fuzz_safetensors_bytes"
path = "fuzz_targets/fuzz_safetensors_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gguf_bytes"
path = "fuzz_targets/fuzz_gguf_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pth_bytes"
path = "fuzz_targets/fuzz_pth_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_npz_bytes"
path = "fuzz_targets/fuzz_npz_bytes.rs"
test = false
doc = false
bench = false

# Magic-byte format detection. Distinct from the per-format targets because it
# runs *before* one is chosen, and because separating `.npz` from `.pth` means
# walking a ZIP central directory built from arbitrary bytes.
[[bin]]
name = "fuzz_detect_format"
path = "fuzz_targets/fuzz_detect_format.rs"
test = false
doc = false
bench = false
