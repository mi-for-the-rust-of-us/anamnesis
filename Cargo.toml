[package]
name = "anamnesis"
version = "0.7.3"
edition = "2024"
rust-version = "1.88"
description = "Parse any tensor format, recover any precision — framework-agnostic FP8/GPTQ/AWQ/BnB dequantization, NPZ parsing, and PyTorch .pth conversion for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mi-for-the-rust-of-us/anamnesis"
homepage = "https://github.com/mi-for-the-rust-of-us/anamnesis"
documentation = "https://docs.rs/anamnesis"
keywords = ["safetensors", "dequantization", "pytorch", "gptq", "machine-learning"]
categories = ["science", "parser-implementations"]
default-run = "anamnesis"
# Kept out of the published crate. Neither path is reachable from a consumer's
# build, and together they were 71 % of what the registry served.
#
# `/fuzz` is the cargo-fuzz harness: dev-only (nightly + libFuzzer), and it must
# never affect the build for ordinary users.
#
# `/tests` is the cross-validation corpus. `tests/fixtures` alone is 6.33 MiB of
# binary goldens, which took the published `.crate` to 4.8 MiB gzipped against
# the registry's 10 MiB cap. Measured with `cargo package`, excluding it leaves
# a 2.2 MiB payload that is almost entirely text and gzips to **628 687 bytes
# (0.60 MiB)**, an 8.0x reduction. The cap was also starting to constrain how wide
# those goldens could be, which is backwards: the test corpus should be sized by
# the correctness claim it has to support, and the artefact by what consumers
# actually need.
#
# The tests are NOT gone. Every tag gets a GitHub Release, and GitHub's
# per-tag source tarball carries `tests/` verbatim:
#
#   https://github.com/mi-for-the-rust-of-us/anamnesis/archive/refs/tags/vX.Y.Z.tar.gz
#
# `scripts/verify-claims.{ps1,sh}` runs the cross-validation suites from there.
# See the "Verifying the correctness claims" section in README.md.
#
# Excluding `/tests` does not weaken the release gate: `cargo package`'s
# verification build never compiled test code anyway, and
# `.github/workflows/publish.yml` runs `cargo test --all-features` before it
# runs `cargo publish`. `/benches` deliberately stays, because the `[[bench]]`
# targets below are declared explicitly and would dangle without their sources.
exclude = ["/fuzz", "/tests"]

# `[package.metadata.docs.rs]` accepts only docs.rs-specific build keys
# (features, targets, all-features, no-default-features). Other Cargo
# package fields placed here are silently ignored — `categories` and
# `default-run` previously sat here and never took effect, so the
# published crate had no categories on crates.io and `cargo run` without
# `--bin` errored. Both keys now sit in `[package]` where Cargo reads
# them.
[package.metadata.docs.rs]
features = ["npz", "pth", "gguf", "awq", "gptq", "bnb", "ollama"]

# Production release artefacts (the `anamnesis` / `amn` CLI binaries, and any
# release build of the library) abort on panic. The untrusted-input DoS analysis
# (`ROADMAP.md` Phases 6.6–6.13, `CHANGELOG.md` Security notes, `src/parse/pth.rs`)
# treats a reachable panic as a process kill and argues severity on that basis;
# `panic = "abort"` makes that the committed, fail-closed behaviour rather than an
# unstated assumption. Cargo automatically rebuilds test/bench targets with
# `unwind` (libtest requires it), so `cargo test` / `cargo test --release` are
# unaffected.
#
# Phase 6.13 exception: the PyO3 extension `cdylib` must build `panic = "unwind"`
# so PyO3 converts a Rust panic into a catchable Python `PanicException` instead
# of aborting the host worker. That override lives in `[profile.python]` below;
# Phase 8's maturin build selects it with `--profile python`.
[profile.release]
panic = "abort"

# The profile the Phase 8 PyO3 `cdylib` is built with (maturin `--profile
# python`). Identical to `release` except panics **unwind**: PyO3's panic
# boundary turns an unwinding panic into a catchable Python `PanicException`,
# whereas `panic = "abort"` would kill the worker uncatchably — voiding the
# bindings' "malformed bytes -> exception, never a dead worker" pledge. Enforced
# by `tests/panic_profile.rs`; see `docs/python-interop.md`.
[profile.python]
inherits = "release"
panic = "unwind"

[features]
default = ["parallel"]
cli = ["dep:clap"]
# Multi-threaded per-tensor dequantisation (Phase 7). Zero third-party
# dependency: uses `std::thread::scope` over disjoint per-tensor chunks. The
# thread budget is caller-owned and hardware-bounded (default `min(cores, 4)`);
# with this feature off the dequant path is always sequential. See
# `docs/perf-experiments.md` Experiment 11 for the measured ~3–4× scaling.
parallel = []
gptq = []
awq = []
bnb = []
npz = ["dep:flate2"]
pth = ["dep:flate2"]
gguf = []
# Ollama model-cache path resolver — turns `ollama:llama3.2:1b` into
# the local GGUF blob path by reading the Ollama manifest. Adds NO
# third-party dependency: uses only stdlib + `serde_json` (already a
# runtime dep). Implies `gguf` because every Ollama blob is a GGUF.
ollama = ["gguf"]
indicatif = ["dep:indicatif"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
float8 = "0.7"
half = "2"
indicatif = { version = "0.18", optional = true }
# memmap2 is mandatory: used by the always-on safetensors `parse()` path
# to avoid eagerly reading the full file into a `Vec<u8>` (`fs::read`).
# See `docs/perf-experiments.md` entry on audit finding #2.
memmap2 = "0.9"
# Pure-Rust DEFLATE inflate backend (`miniz_oxide`) for `.npz` DEFLATE entries.
# Since Phase 6.12 the `.pth` / `.npz` container parsing is owned by the
# vendored `src/parse/zip.rs` reader (the `zip` crate is dev-only now — see
# `[dev-dependencies]`); `flate2` remains the runtime codec the vendored reader
# delegates inflate to. Enabled by the `npz` / `pth` features.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "anamnesis"
path = "src/bin/anamnesis.rs"
required-features = ["cli"]

[[bin]]
name = "amn"
path = "src/bin/amn.rs"
required-features = ["cli"]

# ThreadSanitizer harness (dev-only in spirit; see the file's module docs).
#
# It is a *binary* rather than a test on purpose: TSan needs an instrumented
# `std` (`-Zbuild-std`), and `-Zbuild-std` is unusable with `cargo test`
# (rust-lang/cargo#13146) because `cargo test` also builds dev-dependencies,
# several of which are crates `std` itself depends on — which collide as
# "duplicate lang item in crate `core`". `cargo run --bin` builds no
# dev-dependencies, so this target can be built the way the Unstable Book's own
# sanitizer example is.
#
# `required-features = ["parallel"]` keeps it out of a sequential build, where
# it would have nothing to check.
[[bin]]
name = "tsan-harness"
path = "src/bin/tsan_harness.rs"
required-features = ["parallel"]

[dev-dependencies]
# Phase 6.5 dev-only benchmark harness. Provides statistical-rigour
# throughput measurement (Welch t-tests, bootstrap CIs), HTML report
# generation, and regression detection across runs. The `html_reports`
# feature is left at its default — Criterion's reports live in
# `target/criterion/` and are never published.
#
# Aliased to `codspeed-criterion-compat` (a drop-in for criterion 0.5): a plain
# `cargo bench` behaves exactly like upstream criterion, while under
# `cargo codspeed` it emits CodSpeed measurements for CI regression tracking.
# The bench `.rs` sources keep their `use criterion::…` imports unchanged. See
# `.github/workflows/codspeed.yml`.
#
# The MAJOR version MUST match the `cargo-codspeed` binary the CI installs
# (currently v5): the *walltime* instrument fails to collect results on a
# major-version mismatch (it errors "Failed to collect walltime results ...
# same major version as cargo-codspeed"). Simulation tolerates a mismatch;
# walltime does not. Keep this bumped in lockstep with the CI's cargo-codspeed.
criterion = { package = "codspeed-criterion-compat", version = "5" }
# Phase 6.5 dev-only peak-heap profiler. The `tests/peak_heap_*.rs`
# binaries (and only there) declare `dhat::Alloc` as their
# `#[global_allocator]`, so every allocation in those binaries is
# wrapped — but actual heap-stats tracking only starts when a
# `dhat::Profiler` is constructed inside a test fn. Both peak_heap
# tests in each binary are `#[ignore]`d so default `cargo test`
# skips them entirely; the dhat allocator's per-allocation overhead
# is paid only at binary startup (a few KiB to a few ms) and
# `Profiler` is never created. Two assertion forms ship:
# `K × out_features × 4` ratio (GPTQ/AWQ) and `4 KiB` noise-tolerance
# decomposition (BnB-DQ). See `tests/peak_heap_README.md` for the
# rationale + calibration tables.
dhat = "0.3"
tempfile = "3"
# Phase 6.12: `zip` is dev-only now — the runtime container parsing is owned by
# the vendored `src/parse/zip.rs` reader. The crate is retained here for the
# `ZipWriter` test fixtures and as the differential oracle the vendored reader
# is checked against (`fuzz_zip` + the in-crate `differential_*` tests). Same
# inflate-only feature set the runtime dep carried (no `zopfli` compressor).
#
# HELD AT v2 DELIBERATELY. `cargo update` reports v8 available and will keep
# reporting it; this is not an oversight. Rebasing the oracle across six majors
# means porting the `ZipWriter` fixtures, the `differential_*` tests and the
# `fuzz_zip` harness, which is its own piece of work with its own risk of
# silently weakening the very cross-check it exists to provide. It is also
# dev-only, so the version here ships to nobody: no downstream user resolves it
# and no published artefact contains it. Bump it as a dedicated change with the
# differential suite re-run, never as part of a routine refresh.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
# The runtime `flate2` dependency above is `optional` (off unless `npz`/`pth`)
# and pins `default-features = false`, which suppresses flate2's backend. When a
# default-feature `--all-targets` test build pulls `flate2` via the `zip`
# dev-dependency, that suppression would leave it backend-less, so re-assert the
# pure-Rust `rust_backend` (miniz_oxide) here for the test/bench build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Phase 6.5: dequantisation throughput benchmarks (decode side).
# Will gain `benches/encode.rs` at Phase 7.5 when the encode kernels
# land; today's deferred-split rationale lives in ROADMAP.md.
[[bench]]
name = "dequant"
harness = false
required-features = ["gptq", "awq", "bnb", "gguf"]

# Phase 6.5: parser throughput benchmarks vs raw `fs::read` baseline.
[[bench]]
name = "parsing"
harness = false
required-features = ["npz", "pth", "gguf"]

# Phase 7.2: whole-model throughput for the *threaded* paths, each measured at
# 1 and 4 threads. `dequant` covers single kernels and `parsing` covers headers;
# neither exercises the thread pool, so before this target the ~3-4x from Phase 7
# and the ~1.9x GGUF-reader win from Phase 7.2 had no continuous regression
# guard. The 1-vs-4 pair is the signal: a dispatch that silently serialises shows
# up as threads_4 converging on threads_1.
[[bench]]
name = "convert"
harness = false
required-features = ["gguf"]

[lints.rust]
# `deny` (not `forbid`) so feature-gated modules (e.g., pth with memmap2)
# can opt in to unsafe with a local #[allow(unsafe_code)] + // SAFETY: comment.
unsafe_code = "deny"
elided_lifetimes_in_paths = "deny"

[lints.clippy]
# Pedantic: catch more issues (priority -1 so specific overrides below take effect)
pedantic = { level = "warn", priority = -1 }

# Rule 3: No panics
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Rule 7: Exhaustive matching
wildcard_enum_match_arm = "deny"

# Rule 2: Explicit conversions
as_conversions = "warn"

# Rule 9: Prefer iterators
explicit_iter_loop = "warn"
manual_filter_map = "warn"
manual_find_map = "warn"
needless_range_loop = "warn"

# Rule 17: #[must_use]
must_use_candidate = "warn"

# Additional strictness
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Allow noisy pedantic lints
module_name_repetitions = "allow"
too_many_lines = "allow"
